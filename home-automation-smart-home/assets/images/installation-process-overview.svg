<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Nexora six-step smart home installation process</title>
  <desc id="desc">Consultation, site assessment, smart home design, product selection, professional installation, and testing and handover.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D9C6A3"/><stop offset="1" stop-color="#B08D57"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#211b11" flood-opacity=".10"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="558" rx="28" fill="#F7F4ED" stroke="#E6DDCE" stroke-width="2"/>
  <g fill="none" stroke="#C9B58F" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 12">
    <path d="M358 155h78"/><path d="M758 155h78"/><path d="M1038 236v90"/><path d="M842 405h-78"/><path d="M442 405h-78"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g><rect x="42" y="55" width="316" height="200" rx="22" fill="#fff" stroke="#E6DDCE"/><circle cx="200" cy="112" r="34" fill="url(#gold)"/><text x="200" y="121" fill="#fff" font-size="27" font-weight="700">01</text><text x="200" y="181" fill="#29251F" font-size="23" font-weight="700">Consultation</text><text x="200" y="214" fill="#766E62" font-size="16">Understand your goals</text></g>
    <g><rect x="442" y="55" width="316" height="200" rx="22" fill="#fff" stroke="#E6DDCE"/><circle cx="600" cy="112" r="34" fill="url(#gold)"/><text x="600" y="121" fill="#fff" font-size="27" font-weight="700">02</text><text x="600" y="181" fill="#29251F" font-size="23" font-weight="700">Site Assessment</text><text x="600" y="214" fill="#766E62" font-size="16">Review your home</text></g>
    <g><rect x="842" y="55" width="316" height="200" rx="22" fill="#fff" stroke="#E6DDCE"/><circle cx="1000" cy="112" r="34" fill="url(#gold)"/><text x="1000" y="121" fill="#fff" font-size="27" font-weight="700">03</text><text x="1000" y="181" fill="#29251F" font-size="23" font-weight="700">Smart Home Design</text><text x="1000" y="214" fill="#766E62" font-size="16">Plan rooms and scenes</text></g>
    <g><rect x="842" y="305" width="316" height="200" rx="22" fill="#fff" stroke="#E6DDCE"/><circle cx="1000" cy="362" r="34" fill="url(#gold)"/><text x="1000" y="371" fill="#fff" font-size="27" font-weight="700">04</text><text x="1000" y="431" fill="#29251F" font-size="23" font-weight="700">Product Selection</text><text x="1000" y="464" fill="#766E62" font-size="16">Choose compatible devices</text></g>
    <g><rect x="442" y="305" width="316" height="200" rx="22" fill="#fff" stroke="#E6DDCE"/><circle cx="600" cy="362" r="34" fill="url(#gold)"/><text x="600" y="371" fill="#fff" font-size="27" font-weight="700">05</text><text x="600" y="431" fill="#29251F" font-size="23" font-weight="700">Installation</text><text x="600" y="464" fill="#766E62" font-size="16">Expert setup and calibration</text></g>
    <g><rect x="42" y="305" width="316" height="200" rx="22" fill="#fff" stroke="#E6DDCE"/><circle cx="200" cy="362" r="34" fill="url(#gold)"/><text x="200" y="371" fill="#fff" font-size="27" font-weight="700">06</text><text x="200" y="431" fill="#29251F" font-size="23" font-weight="700">Testing &amp; Handover</text><text x="200" y="464" fill="#766E62" font-size="16">Learn and enjoy your home</text></g>
