<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Nexora Home account password and regain access to your smart home.">
  <title>Forgot Password | Nexora Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <button class="theme-toggle" style="position:fixed;top:20px;right:20px;z-index:100;" aria-label="Toggle theme">
    <i class="bi bi-moon-fill"></i>
  </button>

  <div class="dir-toggle" role="group" aria-label="Text direction" style="position:fixed;top:20px;right:70px;z-index:100;">
    <button type="button" class="dir-btn is-active" data-dir="ltr" aria-pressed="true" aria-label="Left to right">LTR</button>
    <button type="button" class="dir-btn" data-dir="rtl" aria-pressed="false" aria-label="Right to left">RTL</button>
  </div>

  <div class="auth-layout">
    <div class="auth-visual">
      <div class="auth-visual-content">
        <i class="bi bi-key"></i>
        <h3>Reset Password</h3>
        <p>Recover access to your smart home in just a few simple steps.</p>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-container">
        <h2>Forgot Password?</h2>
        <p>No worries. Enter your email address and we'll send you a link to reset your password.</p>

        <form id="forgot-password-form" novalidate>
          <div class="form-group">
            <label for="forgot-email">Email Address</label>
            <input type="email" class="form-control" id="forgot-email" name="email" placeholder="you@example.com" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;">
            <i class="bi bi-envelope-paper"></i> Send Reset Link
          </button>
        </form>

        <div class="auth-form-links">
          <a href="login.html"><i class="bi bi-arrow-left"></i> Back to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/navbar.js"></script>
  <script src="../assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-password-form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const email = form.querySelector('[name="email"]');
        if (!email.value.trim()) return;
        showToast('Reset Link Sent!', 'Check your inbox for instructions to reset your password.', 'success');
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      });
    });
  </script>
</body>
</html>
