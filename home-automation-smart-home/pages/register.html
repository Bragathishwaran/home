<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Nexora Home account and start automating your smart home today.">
  <title>Register | Nexora Home</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="../favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <button class="theme-toggle" style="position:fixed;top:20px;right:20px;z-index:100;" aria-label="Toggle theme">
    <i class="bi bi-moon-fill"></i>
  </button>

  <div class="dir-toggle" role="group" aria-label="Text direction" style="position:fixed;top:20px;right:70px;z-index:100;">
    <button type="button" class="dir-btn is-active" data-dir="ltr" aria-pressed="true" aria-label="Left to right">LTR</button>
    <button type="button" class="dir-btn" data-dir="rtl" aria-pressed="false" aria-label="Right to left">RTL</button>
  </div>

  <div class="auth-layout">
    <div class="auth-visual">
      <img class="auth-visual-bg" src="../assets/images/rooms/living-room-1.jpg" alt="Welcome to your smart living room" loading="lazy">
      <div class="auth-visual-content">
        <i class="bi bi-houses"></i>
        <h3>Join Nexora</h3>
        <p>Create your account and bring intelligence to every corner of your home.</p>
      </div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-container">
        <a href="../index.html" class="auth-brand" aria-label="Go to Nexora Home">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="36" rx="8" fill="url(#logo-grad-auth)"/>
            <path d="M18 8L8 16V28H14V22H22V28H28V16L18 8Z" fill="white" fill-opacity="0.95"/>
            <circle cx="18" cy="18" r="3" fill="url(#logo-grad-auth)" opacity="0.9"/>
            <defs>
              <linearGradient id="logo-grad-auth" x1="0" y1="0" x2="36" y2="36">
                <stop stop-color="#B08D57"/>
                <stop offset="1" stop-color="#D9C6A3"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="brand-name">NEXORA</span>
        </a>
        <h2>Create your account</h2>
        <p>Get started with smart home automation in minutes.</p>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input type="text" class="form-control" id="reg-name" name="name" placeholder="John Doe" required>
          </div>

          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <input type="email" class="form-control" id="reg-email" name="email" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label for="reg-phone">Phone Number</label>
            <input type="tel" class="form-control" id="reg-phone" name="phone" placeholder="+91 98765 43210" required>
          </div>

          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" class="form-control" id="reg-password" name="password" placeholder="Create a password" required>
            <div class="password-strength">
              <div class="strength-bar"><div class="strength-bar-fill"></div></div>
              <span class="strength-text">Enter a password</span>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-confirm-password">Confirm Password</label>
            <input type="password" class="form-control" id="reg-confirm-password" name="confirm-password" placeholder="Repeat your password" required>
          </div>

          <div class="form-group">
            <label style="margin:0;font-weight:500;display:flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" name="terms" required>
              I agree to the <a href="legal.html#terms" style="color:var(--electric-cyan);font-weight:600;margin-left:4px;">Terms &amp; Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-primary" style="width:100%;">
            <i class="bi bi-person-plus"></i> Create Account
          </button>
        </form>

        <div class="auth-form-divider">or</div>

        <button type="button" class="auth-social-btn">
          <i class="bi bi-google"></i> Sign up with Google
        </button>

        <div class="auth-form-links">
          Already have an account? <a href="login.html">Sign In</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/navbar.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/forms.js"></script>
</body>
</html>
