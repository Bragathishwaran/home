<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found - Nexora Home">
  <title>404 - Page Not Found | Nexora Home</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/animations.css">
</head>
<body>
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient-hero);
      text-align: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }
    .error-page::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(176, 141, 87, 0.08) 0%, transparent 70%);
    }
    .error-content { position: relative; z-index: 1; max-width: 480px; }
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(4rem, 12vw, 7rem);
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
      letter-spacing: -0.04em;
    }
    .error-content h2 { color: var(--text-primary); margin-bottom: 12px; }
    .error-content p { color: var(--text-secondary); margin-bottom: 32px; font-size: 1.05rem; }
    .error-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .error-icon { font-size: 3rem; color: var(--accent-strong); margin-bottom: 24px; opacity: 1; }
    .theme-toggle-error {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--border-radius-sm);
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 10;
      transition: all var(--transition-fast);
    }
    .theme-toggle-error:hover { color: var(--electric-cyan); }
  </style>

  <div class="error-page">
    <button class="theme-toggle-error" onclick="toggleTheme()" aria-label="Toggle theme"><i class="bi bi-moon-fill"></i></button>
    <div class="error-content">
      <div class="error-icon"><i class="bi bi-house-x"></i></div>
      <div class="error-code">404</div>
      <h2>This Room Doesn't Exist</h2>
      <p>Looks like the page you're looking for has moved, or was never installed. Let's get you back to a space that works.</p>
      <div class="error-actions">
        <a href="/" class="btn btn-primary"><i class="bi bi-house"></i> Back to Home</a>
        <a href="/pages/contact.html" class="btn btn-outline">Contact Support</a>
      </div>
    </div>
  </div>

  <script src="/assets/js/theme.js"></script>
  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
      localStorage.setItem('nexora-theme', current === 'dark' ? 'light' : 'dark');
      const icon = document.querySelector('.theme-toggle-error i');
      icon.className = current === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
    }
  </script>
</body>
</html>
